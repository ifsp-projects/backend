services:
  api:
    build:
      context: .
      target: deps
    image: capivara-solidaria-api:development
    container_name: capivara-api-development
    command: pnpm dev
    ports:
      - "8000:8000"
    env_file:
      - .env.development
    init: true
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: capivara-postgres-development
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=capivara-solidaria-db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    
networks:
  app-network:
    driver: bridge