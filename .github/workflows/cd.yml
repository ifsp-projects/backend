name: "Build and Deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  ZONE: ${{ vars.ZONE }}
  IMAGE_TAG: ${{ github.sha }}
  NODE_VERSION: ${{ vars.NODE_VERSION }}
  IMAGE_REPOSITORY: ifsp-extensao-api-module-prod

jobs:
  build-deploy:
    name: "Build and Deploy"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate and write runtime configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          WEBPAGE_BASE_URL: ${{ vars.WEBPAGE_BASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ORGANIZATION_ID: ${{ vars.OPENAI_ORGANIZATION_ID }}
          OPENAI_PROJECT_ID: ${{ vars.OPENAI_PROJECT_ID }}
          POSTHOG_READABLE_API_KEY: ${{ secrets.POSTHOG_READABLE_API_KEY }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          GRAFANA_CLOUD_OTLP_ENDPOINT: ${{ vars.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          GRAFANA_CLOUD_AUTH_HEADER: ${{ secrets.GRAFANA_CLOUD_AUTH_HEADER }}
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          GRAFANA_PROMETHEUS_DATASOURCE_UID: ${{ vars.GRAFANA_PROMETHEUS_DATASOURCE_UID }}
          GRAFANA_LOKI_DATASOURCE_UID: ${{ vars.GRAFANA_LOKI_DATASOURCE_UID }}
        run: node devops/write-runtime-env.mjs

      - name: GCP Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./tf
        run: terraform init

      - name: Terraform Apply
        working-directory: ./tf
        run: |
          terraform apply -auto-approve
          echo "VM_HOST=$(terraform output -raw vm_public_ip)" >> $GITHUB_ENV
          echo "REGISTRY_URL=$(terraform output -raw artifact_registry_url)" >> $GITHUB_ENV
        env:
          TF_VAR_ssh_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
          TF_VAR_project_name: ${{ env.PROJECT_NAME }}
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_env: "prod"
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_zone: ${{ env.ZONE }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_READ_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get CodeArtifact token
        shell: bash
        run: |
          echo "CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
            --domain npm \
            --domain-owner 412898606600 \
            --region us-east-1 \
            --query authorizationToken \
            --output text)" >> "$GITHUB_ENV"

      - name: Build, tag, and push image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --secret id=codeartifact_token,env=CODEARTIFACT_AUTH_TOKEN \
            -t $REGISTRY_URL/$IMAGE_REPOSITORY:$IMAGE_TAG \
            -f Dockerfile \
            --build-arg NODE_VERSION="${{ env.NODE_VERSION }}" \
            --no-cache=true .

          docker push $REGISTRY_URL/$IMAGE_REPOSITORY:$IMAGE_TAG

      - name: Copy app configuration to VM
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ env.VM_HOST }}
          username: gcpuser
          key: ${{ secrets.VM_SSH_KEY }}
          source: "deploy/app/.env"
          target: "/home/gcpuser/app"
          strip_components: 2

      - name: Prepare OTel directory on VM
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ env.VM_HOST }}
          username: gcpuser
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/otel
            sudo chown gcpuser:gcpuser /opt/otel
            sudo chmod 755 /opt/otel

      - name: Copy OTel config to VM
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ env.VM_HOST }}
          username: gcpuser
          key: ${{ secrets.VM_SSH_KEY }}
          source: "devops/otel/otel-compose.yaml,devops/otel/collector-config.yaml"
          target: "/opt/otel"
          strip_components: 2

      - name: Copy OTel credentials to VM
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ env.VM_HOST }}
          username: gcpuser
          key: ${{ secrets.VM_SSH_KEY }}
          source: "deploy/otel/.env"
          target: "/opt/otel"
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          REGISTRY_URL: ${{ env.REGISTRY_URL }}
          IMAGE_REPOSITORY: ifsp-extensao-api-module-prod
          IMAGE_TAG: ${{ github.sha }}
          CONTAINER_NAME: api-ifsp
          REGION: ${{ env.REGION }}
        with:
          host: ${{ env.VM_HOST }}
          username: gcpuser
          key: ${{ secrets.VM_SSH_KEY }}
          envs: REGISTRY_URL,IMAGE_REPOSITORY,IMAGE_TAG,CONTAINER_NAME,REGION
          command_timeout: 15m
          script: |
            set -e
            chmod 600 /home/gcpuser/app/.env /opt/otel/.env

            echo "Waiting for Docker daemon..."
            for i in $(seq 1 30); do
              sudo docker info >/dev/null 2>&1 && break
              sleep 3
              if [ "$i" -eq 30 ]; then
                echo "Docker never came up on this VM after 90s"
                exit 1
              fi
            done

            TOKEN=$(curl -sf "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
              -H "Metadata-Flavor: Google" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
            echo $TOKEN | sudo docker login -u oauth2accesstoken --password-stdin https://$REGION-docker.pkg.dev

            sudo docker network inspect observability >/dev/null 2>&1 || sudo docker network create observability

            cd /opt/otel
            sudo docker compose --env-file .env -f otel-compose.yaml up -d
            cd -

            sudo docker pull $REGISTRY_URL/$IMAGE_REPOSITORY:$IMAGE_TAG
            sudo docker stop $CONTAINER_NAME 2>/dev/null || true
            sudo docker rm   $CONTAINER_NAME 2>/dev/null || true
            sudo docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              --network observability \
              --env-file /home/gcpuser/app/.env \
              -p 80:8000 \
              $REGISTRY_URL/$IMAGE_REPOSITORY:$IMAGE_TAG

            sudo docker system prune -f

      - name: Publish Grafana dashboards
        if: ${{ vars.GRAFANA_URL != '' }}
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          GRAFANA_PROMETHEUS_DATASOURCE_UID: ${{ vars.GRAFANA_PROMETHEUS_DATASOURCE_UID }}
          GRAFANA_LOKI_DATASOURCE_UID: ${{ vars.GRAFANA_LOKI_DATASOURCE_UID }}
          GRAFANA_FOLDER_UID: ${{ vars.GRAFANA_FOLDER_UID }}
        run: node devops/otel/publish-dashboards.mjs
